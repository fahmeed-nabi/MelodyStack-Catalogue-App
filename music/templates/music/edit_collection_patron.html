<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Edit Collection</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
    <style>
        /* Ensure the page fills the viewport */
        body {
            display: flex;
            flex-direction: column;
            min-height: 100vh;
        }
        .container {
            flex: 1; /* Take up available space between the header and footer */
        }
        footer {
            background-color: #f8f9fa;
            padding: 1rem 0;
            text-align: center;
        }
    </style>
</head>
<body>
    <div class="container mt-5">
        <h2>Edit Collection: {{ collection.title }}</h2>

        <!-- Display error and success messages -->
        {% if messages %}
            <div class="alert alert-danger" id="messages-alert">
                {% for message in messages %}
                    <p>{{ message }}</p>
                {% endfor %}
            </div>
        {% endif %}

        <form method="post">
            {% csrf_token %}
            <div class="mb-3">
                <label for="title" class="form-label">Collection Title:</label>
                <input type="text" id="title" name="title" class="form-control" value="{{ collection_form.title.value }}" maxlength="100" required>
            </div>

            <div class="mb-3">
                <label for="description" class="form-label">Description:</label>
                <textarea id="description" name="description" class="form-control" rows="4" maxlength="500">{{ collection_form.description.value }}</textarea>
            </div>

            <button type="submit" name="submit_collection" class="btn btn-primary mt-3">Save Changes</button>
            <a href="{% url 'manage_collections_patron' %}" class="btn btn-secondary mt-3">Cancel</a>
        </form>
    </div>

    <!-- Sticky Footer -->
    <footer class="bg-light py-3">
        <div class="container">
            <p class="mb-0">This system is a class project for CS 3240: Software Engineering. It is not monitored, and no real information should be submitted.</p>
        </div>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
