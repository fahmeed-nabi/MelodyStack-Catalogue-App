<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Edit Collection</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/select2/4.1.0-beta.1/css/select2.min.css">
    <style>
        .error-message {
            color: red;
            font-size: 0.9em;
            display: none;
        }
    </style>
</head>
<body>
    <div class="container mt-5">
        <h2>Edit Collection: {{ collection.title }}</h2>

        <!-- Display error and success messages -->
        {% if messages %}
            <div class="alert alert-danger" id="messages-alert">
                {% for message in messages %}
                    <p>{{ message }}</p>
                {% endfor %}
            </div>
        {% endif %}

        <form method="post">
            {% csrf_token %}
            <div class="mb-3">
                <label for="title" class="form-label">Collection Title:</label>
                <input type="text" id="title" name="title" class="form-control" value="{{ collection_form.title.value }}" maxlength="100" required>
            </div>

            <div class="mb-3">
                <label for="description" class="form-label">Description:</label>
                <textarea id="description" name="description" class="form-control" rows="4" maxlength="500">{{ collection_form.description.value }}</textarea>
            </div>

            <div class="mb-3">
                <label for="public" class="form-check-label">Public:</label>
                <input type="checkbox" id="public" name="public" class="form-check-input" {% if collection.public %}checked{% endif %}>
            </div>

            <div class="mb-3">
                <label for="private_users" class="form-label">Private Users:</label>
                <div id="private-users-checkboxes" class="form-control" style="height: auto;">
                    {% for patron in all_patrons %}
                        <div class="form-check">
                            <input class="form-check-input" type="checkbox" value="{{ patron.id }}" id="patron-{{ patron.id }}" name="private_users"
                                {% if patron.id in collection.private_users.all %}checked{% endif %}>
                            <label class="form-check-label" for="patron-{{ patron.id }}">
                                {{ patron.name }}
                            </label>
                        </div>
                    {% endfor %}
                </div>
            </div>

            <div id="collection-error-message" class="error-message">You cannot select both a public collection and private users. Please choose one option.</div>

            <button type="submit" name="submit_collection" class="btn btn-primary mt-3">Save Changes</button>
            <a href="{% url 'manage_collections' %}" class="btn btn-secondary mt-3">Cancel</a>
        </form>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/select2/4.1.0-beta.1/js/select2.min.js"></script>
    <script>
        document.addEventListener("DOMContentLoaded", function () {
            // Initialize Select2 for multi-select dropdowns
            $('.select2').select2();

            // Handle public checkbox change and private users validation
            const publicCheckbox = document.getElementById("public");
            const privateUsersField = document.getElementById("private-users-checkboxes");
            const errorMessage = document.getElementById("collection-error-message");

            publicCheckbox.addEventListener("change", function () {
                const privateUsersChecked = privateUsersField.querySelectorAll('input:checked').length > 0;
                if (this.checked && privateUsersChecked) {
                    errorMessage.style.display = "block";
                } else {
                    errorMessage.style.display = "none";
                }
            });<!DOCTYPE html>
