{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Manage Collections</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
    <style>
        .collection-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px 15px;
            border: 1px solid #ddd;
            border-radius: 5px;
            margin-bottom: 10px;
            background-color: #f8f9fa;
        }
        .collection-item:hover {
            background-color: #e9ecef;
        }
        .collection-title {
            font-weight: 500;
            color: #2c3e50;
        }
        .action-buttons {
            display: flex;
            gap: 10px;
        }
        .return-button {
            margin-bottom: 20px;
        }
        /* Flex container for aligning buttons */
        .button-container {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }
    </style>
</head>
<body>
    <div class="container my-5">
        <!-- Button container for Return to Collections and Back to Dashboard -->
        <div class="button-container">
            <a href="{% url 'collections' %}" class="btn btn-secondary">Return to Collections</a>
            <a href="{% url 'librarian' %}" class="btn btn-primary">Back to Dashboard</a>
        </div>

        <h1 class="text-center text-uppercase fw-light text-dark mb-4">Manage Collections</h1>

        {% if collections %}
            {% for collection in collections %}
                <div class="collection-item">
                    <!-- Collection Title -->
                    <span class="collection-title">{{ collection.title }}</span>

                    <!-- Action Buttons -->
                    <div class="action-buttons">
                        <a href="{% url 'edit_collection' collection.title|slugify %}" class="btn btn-primary btn-sm">Edit</a>
                        <a href="{% url 'delete_collection' collection.title|slugify %}" class="btn btn-danger btn-sm">Delete</a>
                    </div>
                </div>
            {% endfor %}
        {% else %}
            <p class="text-center text-muted fs-5 mt-4">No collections available.</p>
        {% endif %}
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
