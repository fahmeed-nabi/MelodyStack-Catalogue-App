<!DOCTYPE html>
<html lang="en">
  <head>
    <title>Librarian Dashboard</title>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  </head>
  <body class="bg-light">
    <div class="container py-5">
      <div class="card shadow-lg p-4 text-center">
        <div class="card-body">
          <!-- Profile Picture -->
          <img src="{% if librarian_profile_picture %}{{ librarian_profile_picture.url }}{% else %}{{ MEDIA_URL }}https://t4.ftcdn.net/jpg/00/64/67/63/360_F_64676383_LdbmhiNM6Ypzb3FM4PPuFP9rHe7ri8Ju.jpg{% endif %}" class="rounded-circle mb-3" alt="{{ patron_first_name }}'s Profile Picture" width="120" height="120">

          <h1 class="display-4">Welcome, {{ librarian_first_name }}!</h1>
          <h3 class="text-primary">You are a Librarian</h3>
          <p class="text-muted">Joined on: {{ librarian_date_joined }}</p>

          <!-- Bio -->
          {% if librarian_bio %}
            <p class="lead">"{{ librarian_bio }}"</p>
          {% else %}
            <p class="text-muted">No bio available.</p>
          {% endif %}

          <!-- Email -->
          <p><strong>Email:</strong> {{ librarian_email }}</p>

          <!-- Action Buttons -->
          <div class="d-grid gap-3 col-6 mx-auto">
            <a href="#" class="btn btn-outline-primary">📚 View Collections</a>
            <a href="{% url 'librarian_settings' %}" class="btn btn-outline-secondary">⚙️ Settings</a>
            <a href="{% url 'logout_view' %}" class="btn btn-danger">🚪 Logout</a>
          </div>
        </div>
      </div>

      <!-- Placeholder Notifications -->
      <div class="alert alert-info mt-4" role="alert">
        Collections page is under construction!
      </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  </body>
</html>
