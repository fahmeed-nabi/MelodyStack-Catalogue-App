<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Promote Patron</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
    <style>
        html, body {
            height: 100%;
        }

        body {
            display: flex;
            flex-direction: column;
        }

        .container {
            flex: 1;
        }

        .error-message {
            color: red;
            font-size: 0.9em;
            display: none;
        }

        .scroll-container {
            max-height: 700px;
            overflow-y: auto;
            border: 1px solid #ddd;
            padding: 10px;
            border-radius: 5px;
            background-color: #f8f9fa;
        }

        #privateUserSearch {
            width: 100%;
            margin-bottom: 10px;
            border-radius: 30px;
            border: 1px solid #ddd;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1);
            padding: 20px 15px; /* Taller */
            font-size: 1.1rem;
        }

        #privateUserSearch:focus {
            outline: none;
            border-color: #007bff;
            box-shadow: 0 4px 15px rgba(0, 123, 255, 0.25);
        }
    </style>
</head>
<body>
    <div class="container mt-5">
        <div class="text-center mb-4">
            <h2 class="fw-bold display-6">Promote Patron to Librarian</h2>
            <a href="{% url 'librarian' %}" class="btn btn-secondary mt-2">← Back to Dashboard</a>
        </div>

        <form method="post">
            {% csrf_token %}

            <!-- Private Users Section -->
            <div class="mb-3">
                <label for="privateUserSearch" class="form-label">Available Patrons:</label>
                <!-- Search Bar for Filtering Private Users -->
                <input type="text" id="privateUserSearch" class="form-control" placeholder="Search users...">

                <!-- Scrollable Private Users Selection -->
                <div id="privateUsersList" class="scroll-container">
                    {% for patron in all_patrons %}
                        <div class="patron-item d-flex justify-content-between align-items-center mb-2">
                            <span class="patron-title">{{ patron.name }}</span>
                            <div class="action-buttons">
                                <a href="{% url 'promote_patron_confirmation' patron.id %}" class="btn btn-primary btn-sm">Promote</a>
                            </div>
                        </div>
                    {% endfor %}
                </div>
            </div>
        </form>
    </div>

    <!-- Sticky Footer -->
    <footer class="bg-light py-3 text-center mt-auto">
        <p class="mb-0">This system is a class project for CS 3240: Software Engineering. It is not monitored, and no real information should be submitted.</p>
    </footer>

    <script>
        document.addEventListener('DOMContentLoaded', function () {
            const searchInput = document.getElementById('privateUserSearch');
            const userItems = document.querySelectorAll('#privateUsersList .patron-item');

            searchInput.addEventListener('input', function () {
                const query = searchInput.value.toLowerCase().trim();

                userItems.forEach(function (item) {
                    // Use innerText instead of textContent for better whitespace handling
                    const nameElement = item.querySelector('.patron-title');
                    if (!nameElement) return;

                    const name = nameElement.innerText.toLowerCase().trim();
                    const match = name.includes(query);

                    item.style.display = match ? 'flex' : 'none';
                });
            });
        });
    </script>

</body>
</html>
