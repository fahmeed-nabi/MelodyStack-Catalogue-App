<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Promote Patron</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
    <style>
        .error-message {
            color: red;
            font-size: 0.9em;
            display: none;
        }

        /* Scrollable container styling */
        .scroll-container {
            max-height: 200px; /* Set maximum height for the field */
            overflow-y: auto; /* Enable vertical scrolling */
            border: 1px solid #ddd; /* Add border around the field */
            padding: 10px; /* Add padding inside the container */
            border-radius: 5px;
            background-color: #f8f9fa;
        }

        /* Search bar styling */
        #privateUserSearch {
            width: 100%;
            margin-bottom: 10px;
            border-radius: 30px;
            border: 1px solid #ddd;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1);
            padding: 10px;
        }

        #privateUserSearch:focus {
            outline: none;
            border-color: #007bff;
            box-shadow: 0 4px 15px rgba(0, 123, 255, 0.25);
        }
    </style>
</head>
<body>
    <div class="container mt-5">
        <h2>Promote Patrons</h2>

        <form method="post">
            {% csrf_token %}

            <!-- Private Users Section -->
            <div class="mb-3">
                <label for="privateUserSearch" class="form-label">Available Patrons:</label>
                <!-- Search Bar for Filtering Private Users -->
                <input type="text" id="privateUserSearch" class="form-control" placeholder="Search users...">

                <!-- Scrollable Private Users Selection -->
                <div id="privateUsersList" class="scroll-container">
                    {% for patron in all_patrons %}
                        <div class="patron-item">
                            <!-- Collection Title -->
                            <span class="patron-title">{{ patron.name }}</span>

                            <!-- Action Buttons -->
                            <div class="action-buttons">
                                <a href="{% url 'promote_patron_confirmation' patron.id %}" class="btn btn-primary btn-sm">Promote</a>
                            </div>
                        </div>
                    {% endfor %}
                </div>
            </div>
        </form>
    </div>
</body>
</html>
